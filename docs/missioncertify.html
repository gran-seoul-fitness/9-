<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>그랑서울 피트니스 - 미션 인증</title>
<script>
  // iOS Safari는 100vh를 주소창이 사라진 상태 기준으로 계산해서, 실제 보이는
  // 화면보다 페이지가 더 길어져 버튼이 화면 밖으로 밀려날 수 있어요.
  // window.innerHeight로 실제 보이는 높이를 직접 재서 CSS 변수로 넘겨줘요.
  function setRealVH(){
    document.documentElement.style.setProperty('--real-vh', window.innerHeight + 'px');
  }
  setRealVH();
  window.addEventListener('resize', setRealVH);
  window.addEventListener('orientationchange', setRealVH);
</script>
<style>
  @font-face{ font-family:'NanumSquare'; src:url('fonts/NanumSquareL.woff2') format('woff2'); font-weight:300; font-display:swap; }
  @font-face{ font-family:'NanumSquare'; src:url('fonts/NanumSquareR.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face{ font-family:'NanumSquare'; src:url('fonts/NanumSquareB.woff2') format('woff2'); font-weight:700; font-display:swap; }
  @font-face{ font-family:'NanumSquare'; src:url('fonts/NanumSquareEB.woff2') format('woff2'); font-weight:800; font-display:swap; }
</style>
<style>

  :root{
    --bg-deep:#101718;
    --bg-panel:#1a2224;
    --bg-panel-2:#212b2d;
    --mint:#3EE3C7;
    --mint-soft:#8FF4E1;
    --ember:#FF6B4A;
    --text:#F2F6F5;
    --muted:#829894;
    --muted2:#7E9591;
    --line: rgba(62,227,199,0.16);
    --locked:#2a3436;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; font-weight:300;}
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 20% 10%, rgba(62,227,199,0.08), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(255,107,74,0.06), transparent 40%),
      var(--bg-deep);
    font-family:'NanumSquare', sans-serif;
    padding:32px 16px;
  }

  .phone{
    width:390px; max-width:100%;
    height:800px; max-height:92vh;
    background:linear-gradient(180deg,#151d1e 0%, #0d1213 100%);
    border-radius:44px;
    border:1px solid rgba(255,255,255,0.06);
    box-shadow:0 30px 80px rgba(0,0,0,0.55), inset 0 0 40px rgba(62,227,199,0.03);
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
  }

  .statusbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 26px 4px; color:var(--muted2); font-size:13px; font-weight:700;
  }

  /* 실제 폰에서 열었을 때는 폰 목업 틀 없이 화면 전체를 꽉 채워요. */
  @media (max-width:480px){
    body{ padding:0; min-height:100vh; min-height:var(--real-vh, 100vh); }
    .phone{
      width:100%; height:100vh; height:100dvh; height:var(--real-vh, 100vh); max-height:none;
      border-radius:0; border:none; box-shadow:none;
    }
  }
  .topbar{
    display:flex; align-items:center; gap:12px;
    padding:8px 22px 0;
  }
  .back-btn{
    width:34px;height:34px; border-radius:50%;
    background:var(--bg-panel); border:1px solid rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:center;
    color:var(--text); font-size:16px; flex-shrink:0;
    cursor:pointer; transition:transform .12s ease;
  }
  .back-btn:active{ transform:scale(0.88); }
  .topbar-title{ color:var(--text); font-size:14px; font-weight:800; }

  /* ================= SCREEN 1: UPLOAD ================= */
  #uploadScreen{ flex:1; display:flex; flex-direction:column; overflow-y:auto; }
  .equip-card{ animation:mcFadeInUp .45s ease both; animation-delay:.05s; }
  .upload-zone{ animation:mcFadeIn .45s ease both; animation-delay:.15s; }
  @keyframes mcFadeInUp{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes mcFadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .preview-check{ animation:mcCheckPop .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes mcCheckPop{ 0%{ transform:scale(0.4); opacity:0; } 70%{ transform:scale(1.12); opacity:1; } 100%{ transform:scale(1); } }

  .header-copy{ padding:10px 26px 4px; }
  .eyebrow{ color:var(--mint); font-size:10.5px; font-weight:700; letter-spacing:3px; margin-bottom:4px; }
  h1{
    font-family:'NanumSquare', sans-serif; font-weight:900; color:var(--text);
    font-size:22px; line-height:1.25; margin:0 0 4px; letter-spacing:0.3px;
  }
  h1 em{ color:var(--mint); font-style:normal; -webkit-text-stroke:0.5px var(--mint); }
  .sub{ color:var(--muted2); font-size:12.5px; line-height:1.5; margin:0; }

  .equip-card{
    margin:10px 22px 0;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    flex-shrink:0;
  }
  .equip-gallery-wrap{ padding:10px 10px 0; }
  .equip-gallery-tabs{ display:flex; gap:6px; margin-bottom:8px; }
  .equip-gallery-tab{
    flex:1; text-align:center;
    padding:7px 8px; border-radius:100px;
    background:var(--bg-panel-2); border:1px solid var(--line);
    color:var(--muted2); font-size:11px; font-weight:700;
    cursor:pointer; transition:all .15s ease;
  }
  .equip-gallery-tab.active{
    background:rgba(62,227,199,0.14); border-color:var(--mint);
    color:var(--mint-soft);
  }
  .equip-gallery{
    display:flex; gap:8px; overflow-x:auto;
    scroll-snap-type:x mandatory;
  }
  .equip-gallery::-webkit-scrollbar{ display:none; }
  .equip-gallery-item{
    position:relative; flex:0 0 auto;
    width:78%; aspect-ratio: 16 / 8;
    border-radius:14px; overflow:hidden;
    scroll-snap-align:start;
  }
  .equip-gallery-item.single{ width:100%; }
  .equip-gallery-item img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:saturate(1.05) contrast(1.02);
  }
  .equip-gallery-item::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(16,23,24,0) 55%, rgba(16,23,24,0.55) 100%);
  }
  .equip-photo-tag{
    position:absolute; left:12px; bottom:10px; z-index:2;
    background:rgba(16,23,24,0.75);
    border:1px solid rgba(62,227,199,0.4);
    color:var(--mint-soft);
    font-size:10.5px; font-weight:800;
    padding:5px 10px; border-radius:100px;
    backdrop-filter:blur(3px);
  }
  .equip-info{ padding:10px 16px 12px; }
  .equip-name{ color:var(--text); font-size:15px; font-weight:800; margin-bottom:6px; }
  .equip-sets{ display:flex; gap:6px; flex-wrap:wrap; }
  .set-chip{
    background:var(--bg-panel-2); color:var(--mint-soft);
    font-size:10.5px; font-weight:700;
    padding:4px 9px; border-radius:100px;
    border:1px solid var(--line);
  }

  .upload-zone{
    margin:12px 22px 0;
    border:1.5px dashed rgba(62,227,199,0.35);
    border-radius:20px;
    background:var(--bg-panel);
    aspect-ratio: 1 / 0.65;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px;
    cursor:pointer;
    transition:border-color .2s ease, background .2s ease;
    position:relative;
    overflow:hidden;
    flex-shrink:0;
  }
  .upload-zone:active{ transform:scale(0.99); }
  .upload-zone.filled{
    border-style:solid; border-color:var(--mint);
    background:linear-gradient(160deg, #1c3430, #142523);
  }
  .upload-zone.disabled{ cursor:not-allowed; opacity:0.55; }
  .upload-zone.disabled:active{ transform:none; }
  #uploadPreviewImg{
    display:none;
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover;
  }
  .upload-zone.filled #uploadPreviewImg{ display:block; }
  .upload-zone.filled .preview-badge{ background:rgba(10,18,17,0.45); backdrop-filter:blur(1px); }

  .upload-icon{
    width:52px; height:52px; border-radius:50%;
    background:var(--bg-panel-2);
    display:flex; align-items:center; justify-content:center;
  }
  .upload-icon svg{ width:24px; height:24px; }
  .upload-text{ color:var(--text); font-size:13.5px; font-weight:700; }
  .upload-hint{ color:var(--muted2); font-size:11px; }

  .preview-badge{
    display:none;
    position:absolute; inset:0;
    align-items:center; justify-content:center;
    flex-direction:column; gap:12px;
  }
  .upload-zone.filled .preview-badge{ display:flex; }
  .upload-zone.filled .upload-icon,
  .upload-zone.filled .upload-text,
  .upload-zone.filled .upload-hint{ display:none; }
  .preview-check{
    width:64px; height:64px; border-radius:50%;
    background:linear-gradient(135deg, var(--mint), #22B79E);
    display:flex; align-items:center; justify-content:center;
  }
  .preview-check svg{ width:30px; height:30px; }
  .preview-label{ color:var(--mint-soft); font-size:13px; font-weight:800; }
  .preview-sub{ color:var(--muted2); font-size:10.5px; }

  .confirm-check{
    display:flex; align-items:center; gap:10px;
    margin:10px 22px 0; padding:10px 14px;
    background:var(--bg-panel);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:14px;
    cursor:pointer;
    transition:border-color .2s ease;
  }
  .confirm-check input{ position:absolute; opacity:0; width:0; height:0; }
  .confirm-box{
    width:22px; height:22px; border-radius:7px; flex-shrink:0;
    border:1.5px solid rgba(255,255,255,0.16);
    background:var(--bg-panel-2);
    display:flex; align-items:center; justify-content:center;
  }
  .confirm-box svg{ width:13px; height:13px; opacity:0; transform:scale(0.5); transition:all .15s cubic-bezier(.34,1.56,.64,1); }
  .confirm-check input:checked ~ .confirm-box{
    background:linear-gradient(135deg, var(--mint), #22B79E);
    border-color:var(--mint);
  }
  .confirm-check input:checked ~ .confirm-box svg{ opacity:1; transform:scale(1); }
  .confirm-check.checked{ border-color:var(--line); }
  .confirm-label{ color:var(--text); font-size:12.5px; font-weight:600; }
  .confirm-label b{ color:var(--mint-soft); font-weight:800; }

  .cta-wrap{ padding:12px 22px 16px; margin-top:auto; }
  .cta{
    width:100%; padding:16px; border:none; border-radius:16px;
    font-family:'NanumSquare', sans-serif; font-size:15px; font-weight:900;
    background:#2a3436; color:#6c7d7a; cursor:not-allowed;
    transition:all .25s ease;
  }
  .cta.ready{
    background:linear-gradient(135deg, var(--mint), #22B79E);
    color:#0a1211; cursor:pointer;
    box-shadow:0 8px 24px rgba(62,227,199,0.3);
  }
  .cta.ready:active{ transform:scale(0.98); }

  /* ================= SCREEN 2: SUCCESS ================= */
  #successScreen{
    display:none;
    flex:1; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 26px; text-align:center; position:relative; overflow:hidden;
  }
  #successScreen.show{ display:flex; }

  .confetti{
    position:absolute; width:8px; height:8px; border-radius:2px;
    background:var(--mint); opacity:0; top:-10px;
  }

  .success-eyebrow{ color:var(--mint); font-size:11px; font-weight:800; letter-spacing:3px; margin-bottom:14px; }

  .success-mascot{ width:130px; height:160px; margin-bottom:6px; filter:drop-shadow(0 10px 20px rgba(0,0,0,0.4)); }
  .success-mascot.celebrate{
    animation:
      mascotPop 0.55s cubic-bezier(.34,1.56,.64,1) both,
      celebrate 0.9s ease-in-out 0.55s infinite;
  }
  @keyframes mascotPop{
    0%{ transform:scale(0.4) rotate(-18deg); opacity:0; }
    70%{ transform:scale(1.08) rotate(4deg); opacity:1; }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  @keyframes celebrate{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    25%{ transform:translateY(-10px) rotate(-4deg); }
    75%{ transform:translateY(-10px) rotate(4deg); }
  }

  .success-title{
    font-family:'NanumSquare', sans-serif; font-weight:900; color:var(--text);
    font-size:24px; margin:6px 0 6px;
  }
  .success-title em{ color:var(--mint); font-style:normal; -webkit-text-stroke:0.5px var(--mint); }
  .success-sub{ color:var(--muted2); font-size:13px; margin-bottom:22px; }

  .reward-card{
    width:100%;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:18px;
    display:flex; align-items:center; gap:14px;
    margin-bottom:24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
  }
  .reward-stamp{
    width:48px; height:48px; border-radius:14px; flex-shrink:0;
    background:linear-gradient(135deg, var(--mint), #22B79E);
    display:flex; align-items:center; justify-content:center;
  }
  .reward-stamp svg{ width:24px; height:24px; }
  .reward-text{ text-align:left; }
  .reward-title{ color:var(--text); font-size:14px; font-weight:800; margin-bottom:2px; }
  .reward-sub{ color:var(--muted2); font-size:11px; }

  .progress-row{
    display:flex; align-items:center; gap:8px;
    width:100%; margin-bottom:26px;
  }
  .progress-row .track{ flex:1; height:8px; border-radius:4px; background:var(--locked); overflow:hidden; }
  .progress-row .fill{ width:57%; height:100%; background:linear-gradient(90deg,var(--mint),#22B79E); border-radius:4px; }
  .progress-row .count{ color:var(--mint); font-size:12px; font-weight:800; white-space:nowrap; }

  .success-cta{
    width:100%; padding:16px; border:none; border-radius:16px;
    font-family:'NanumSquare', sans-serif; font-size:15px; font-weight:900;
    background:linear-gradient(135deg, var(--mint), #22B79E); color:#0a1211;
    box-shadow:0 8px 24px rgba(62,227,199,0.3);
  }
  .success-cta:active{ transform:scale(0.98); }

  @media (prefers-reduced-motion: reduce){
    .success-mascot.celebrate{ animation:none; opacity:1; transform:none; }
    *{ transition-duration:0.01ms !important; animation-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<div class="phone">
  <div class="statusbar"><span>GRAN SEOUL</span></div>
  <div class="topbar">
    <div class="back-btn" id="backBtn">‹</div>
    <div class="topbar-title">미션 인증</div>
  </div>

  <!-- ===== SCREEN 1: UPLOAD ===== -->
  <div id="uploadScreen">
    <div class="header-copy">
      <div class="eyebrow" id="zoneEyebrow">ZONE · 어깨</div>
      <h1>인증샷을<br/><em>올려줘</em></h1>
      <p class="sub" id="uploadSub">기구 앞에서 찍은 사진 한 장이면 충분해요.</p>
    </div>

    <div class="equip-card">
      <div class="equip-gallery-wrap" id="equipGallery"></div>
      <div class="equip-info">
        <div class="equip-name" id="equipName">덤벨 · 숄더프레스존</div>
        <div class="equip-sets" id="equipSets">
          <span class="set-chip">3세트</span>
          <span class="set-chip">12회</span>
          <span class="set-chip">사이드레터럴 병행</span>
        </div>
      </div>
    </div>

    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3EE3C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4,17 V19 a2 2 0 0 0 2 2 h12 a2 2 0 0 0 2 -2 v-2"/><path d="M7,9 L12,4 L17,9"/><path d="M12,4 V15"/></svg>
      </div>
      <div class="upload-text" id="uploadText">탭해서 사진 올리기</div>
      <div class="upload-hint" id="uploadHint">기구와 함께 나와야 인증돼요</div>
      <img id="uploadPreviewImg" src="" alt="" />

      <div class="preview-badge">
        <div class="preview-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0a1211" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5,13 L10,18 L19,7"/></svg>
        </div>
        <div class="preview-label">사진이 담겼어요</div>
        <div class="preview-sub">다시 탭하면 바꿀 수 있어요</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;" />
    </div>

    <label class="confirm-check" id="confirmCheck">
      <input type="checkbox" id="confirmCheckbox" />
      <span class="confirm-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0a1211" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5,13 L10,18 L19,7"/></svg>
      </span>
      <span class="confirm-label" id="confirmLabel">운동 <b>기구</b> 사진을 찍어 인증해주세요</span>
    </label>

    <div class="cta-wrap">
      <button class="cta" id="submitBtn">사진을 먼저 올려주세요</button>
    </div>
  </div>

  <!-- ===== SCREEN 2: SUCCESS ===== -->
  <div id="successScreen">
    <div class="success-eyebrow">MISSION COMPLETE</div>

    <svg class="success-mascot celebrate" id="successMascotSvg" viewBox="0 0 120 150">
      <defs>
        <radialGradient id="tigerBodyDone" cx="35%" cy="26%" r="80%">
          <stop offset="0%" stop-color="#FFBD86"/><stop offset="100%" stop-color="#F1782F"/>
        </radialGradient>
      </defs>
      <path d="M92,114 Q112,106 107,88" stroke="#F1782F" stroke-width="9" fill="none" stroke-linecap="round"/>
      <rect x="99" y="107" width="9" height="5" rx="2" fill="#C24E12" transform="rotate(-25 103 109)"/>
      <rect x="102" y="94" width="9" height="5" rx="2" fill="#C24E12" transform="rotate(-55 106 96)"/>
      <rect x="98" y="112" width="10" height="5" rx="2" fill="#C24E12" transform="rotate(15 103 114)"/>
      <ellipse cx="46" cy="130" rx="10" ry="7" fill="url(#tigerBodyDone)"/>
      <ellipse cx="74" cy="130" rx="10" ry="7" fill="url(#tigerBodyDone)"/>
      <ellipse cx="60" cy="104" rx="26" ry="19" fill="url(#tigerBodyDone)"/>
      <rect x="30" y="108" width="16" height="5" rx="2.5" fill="#C24E12" opacity="0.55" transform="rotate(-8 38 110)"/>
      <rect x="74" y="108" width="16" height="5" rx="2.5" fill="#C24E12" opacity="0.55" transform="rotate(8 82 110)"/>
      <ellipse cx="26" cy="96" rx="12" ry="9" fill="url(#tigerBodyDone)"/>
      <ellipse cx="94" cy="90" rx="12" ry="9" fill="url(#tigerBodyDone)" transform="rotate(-10 94 90)"/>
      <polygon points="100,70 92,84 98,84 90,98 106,80 99,80" fill="#FFD84D"/>
      <circle cx="24" cy="42" r="10" fill="url(#tigerBodyDone)"/>
      <circle cx="96" cy="42" r="10" fill="url(#tigerBodyDone)"/>
      <circle cx="24" cy="43" r="5" fill="#FFD9BE"/>
      <circle cx="96" cy="43" r="5" fill="#FFD9BE"/>
      <circle cx="60" cy="56" r="42" fill="url(#tigerBodyDone)"/>
      <rect x="48" y="26" width="24" height="5" rx="2.5" fill="#8B4A1E"/>
      <rect x="58" y="26" width="4" height="17" rx="2" fill="#8B4A1E"/>
      <rect x="52" y="36" width="16" height="5" rx="2.5" fill="#8B4A1E"/>
      <ellipse cx="38" cy="72" rx="8" ry="6" fill="#FFD9BE" opacity="0.8"/>
      <ellipse cx="82" cy="72" rx="8" ry="6" fill="#FFD9BE" opacity="0.8"/>
      <rect x="36" y="42" width="14" height="4" rx="2" fill="#20140A" transform="rotate(-10 43 44)"/>
      <rect x="70" y="42" width="14" height="4" rx="2" fill="#20140A" transform="rotate(10 77 44)"/>
      <circle cx="46" cy="60" r="5" fill="#20140A"/>
      <circle cx="74" cy="60" r="5" fill="#20140A"/>
      <circle cx="44.5" cy="58.5" r="1.6" fill="#fff"/>
      <circle cx="72.5" cy="58.5" r="1.6" fill="#fff"/>
      <circle cx="60" cy="67" r="5" fill="#20140A"/>
      <path d="M50,78 Q55,84 60,78 Q65,84 70,78" stroke="#20140A" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>

    <div class="success-title" id="successTitle">어깨, <em>클리어!</em></div>
    <div class="success-sub" id="successSub">회원님! 조금 더 힘내세요! 가까워졌어요!</div>

    <div class="reward-card">
      <div class="reward-stamp">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0a1211" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5,13 L10,18 L19,7"/></svg>
      </div>
      <div class="reward-text">
        <div class="reward-title">도장 1개 적립</div>
        <div class="reward-sub">4주 완주 시 해비치 어메니티 3종 리워드</div>
      </div>
    </div>

    <div class="progress-row">
      <span class="count" id="progressCount">4/7</span>
      <span class="track"><span class="fill" id="progressFill"></span></span>
      <span class="count" id="progressPct">57%</span>
    </div>

    <button class="success-cta" id="backToMapBtn">맵으로 돌아가기</button>
  </div>
</div>

<script>
  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');
  const uploadPreviewImg = document.getElementById('uploadPreviewImg');
  const submitBtn = document.getElementById('submitBtn');
  const uploadScreen = document.getElementById('uploadScreen');
  const successScreen = document.getElementById('successScreen');
  let pendingPhoto = null;

  const confirmCheck = document.getElementById('confirmCheck');
  const confirmCheckbox = document.getElementById('confirmCheckbox');

  // ===== gymmap.html에서 넘어온 미션 정보 =====
  const pending = JSON.parse(localStorage.getItem('gsPendingMission') || 'null') || {
    zoneKey:'weight', zoneName:'웨이트', missionId:'shoulder', missionName:'어깨',
    sets:['3세트','12회','사이드레터럴 병행'], equipPhoto:'', equipNoun:'기구', doneBefore:5, total:10,
    equipOptions: [
      { name:'숄더프레스', img:'images/equipment/shoulder-press.jpg' },
      { name:'덤벨존', img:'images/equipment/shoulder-dumbbell.jpg' },
      { name:'케이블(펑셔널 트레이너)', img:'images/equipment/shoulder-cable.jpg' },
    ],
  };
  const character = JSON.parse(localStorage.getItem('gsCharacter') || 'null') || { key:'tiger', name:'회원' };

  // 구글 시트/드라이브에 실제로 기록하는 Apps Script 웹앱 주소예요.
  // 원본 스프레드시트(8월 회원 데이터가 있는 그 파일)에 새 버전으로 배포된 실제 주소예요.
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzaToECEBXQX9nmqd4hB9otimqlmzOdy6FXINireQxGS1zZpg1ZmQgp8WtH44nROmbwnA/exec';

  // 받침 유무에 따라 조사를 올바르게 선택 (은/는, 이/가 등)
  function josa(word, withBatchim, withoutBatchim){
    const ch = (word || '').trim().slice(-1);
    const code = ch.charCodeAt(0) - 0xAC00;
    const hasBatchim = code < 0 || code > 11171 ? true : (code % 28) !== 0;
    return hasBatchim ? withBatchim : withoutBatchim;
  }

  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  // ===== 스탬프는 하루에 한 번만 — gymmap.html에서 넘어와도 여기서 한 번 더 확인 =====
  const savedProgress = JSON.parse(localStorage.getItem('gsProgress') || 'null') || { photos: {} };
  const alreadyStampedToday = savedProgress.lastCertifyDate === todayStr();

  const equipNoun = pending.equipNoun || '기구';

  document.getElementById('zoneEyebrow').textContent = pending.zoneName;
  document.getElementById('equipName').textContent = `${pending.zoneName} · ${pending.missionName}`;
  document.getElementById('equipSets').innerHTML = pending.sets.map(s => `<span class="set-chip">${s}</span>`).join('');
  const equipOptions = pending.equipOptions && pending.equipOptions.length ? pending.equipOptions : (pending.equipPhoto ? [{ name: pending.missionName, img: pending.equipPhoto }] : []);
  const equipGalleryEl = document.getElementById('equipGallery');
  equipGalleryEl.style.display = equipOptions.length ? '' : 'none';

  function renderEquipRow(opts){
    return `<div class="equip-gallery">${opts.map(opt => `
      <div class="equip-gallery-item ${opts.length === 1 ? 'single' : ''}">
        <img src="${opt.img}" alt="${pending.zoneName} 존 ${opt.name}" />
        <span class="equip-photo-tag">${opt.name}</span>
      </div>
    `).join('')}</div>`;
  }

  const equipHasGroups = equipOptions.some(o => o.group);
  if (equipHasGroups){
    const equipGroups = [...new Set(equipOptions.map(o => o.group))];
    let activeEquipGroup = equipGroups[0];
    const renderGroupedEquip = () => {
      const tabs = equipGroups.map(g => `<div class="equip-gallery-tab ${g === activeEquipGroup ? 'active' : ''}" data-group="${g}">${g}</div>`).join('');
      equipGalleryEl.innerHTML = `<div class="equip-gallery-tabs">${tabs}</div>${renderEquipRow(equipOptions.filter(o => o.group === activeEquipGroup))}`;
      equipGalleryEl.querySelectorAll('.equip-gallery-tab').forEach(tab => {
        tab.addEventListener('click', () => { activeEquipGroup = tab.dataset.group; renderGroupedEquip(); });
      });
    };
    renderGroupedEquip();
  } else {
    equipGalleryEl.innerHTML = renderEquipRow(equipOptions);
  }

  document.getElementById('uploadSub').textContent = `${equipNoun}${josa(equipNoun, '이', '가')} 보이게 찍은 사진 한 장이면 충분해요.`;
  document.getElementById('uploadHint').textContent = `${equipNoun}${josa(equipNoun, '과', '와')} 함께 나와야 인증돼요`;
  const CONFIRM_TEXT = {
    '기구': '운동 <b>기구</b> 사진을 찍어 인증해주세요',
    '매트': '운동하신 <b>매트</b>를 찍어 인증해주세요',
  };
  document.getElementById('confirmLabel').innerHTML = CONFIRM_TEXT[equipNoun] || CONFIRM_TEXT['기구'];

  function updateSubmitState(){
    if (alreadyStampedToday) return;
    if (pendingPhoto && confirmCheckbox.checked){
      submitBtn.textContent = '인증 완료하기';
      submitBtn.classList.add('ready');
    } else if (pendingPhoto){
      submitBtn.textContent = `${equipNoun}가 나왔는지 확인해주세요`;
      submitBtn.classList.remove('ready');
    } else {
      submitBtn.textContent = '사진을 먼저 올려주세요';
      submitBtn.classList.remove('ready');
    }
  }

  if (alreadyStampedToday){
    uploadZone.classList.add('disabled');
    confirmCheck.style.pointerEvents = 'none';
    confirmCheck.style.opacity = '0.5';
    document.getElementById('uploadText').textContent = '오늘은 이미 스탬프를 찍었어요';
    document.getElementById('uploadHint').textContent = '내일 다시 인증할 수 있어요';
    submitBtn.textContent = '오늘은 이미 인증했어요 · 내일 다시';
  }

  uploadZone.addEventListener('click', () => {
    if (alreadyStampedToday) return;
    fileInput.click();
  });
  // 요즘 폰 카메라 사진은 원본이 몇 MB씩 되기도 해서, 그대로 올리면 업로드가 오래 걸려요.
  // 기구가 맞는지 확인만 하면 되는 용도라 화질을 꽤 낮춰서(최대 800px, JPEG 50%)
  // 훨씬 가볍게 만든 다음 올려요.
  function compressImage(dataUrl, callback){
    const img = new Image();
    img.onload = () => {
      const MAX_DIM = 800;
      let { width, height } = img;
      if (width > MAX_DIM || height > MAX_DIM){
        const scale = MAX_DIM / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', 0.5));
    };
    img.onerror = () => callback(dataUrl); // 혹시 실패하면 원본 그대로 사용
    img.src = dataUrl;
  }

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      compressImage(e.target.result, (compressed) => {
        pendingPhoto = compressed;
        uploadPreviewImg.src = pendingPhoto;
        uploadZone.classList.add('filled');
        updateSubmitState();
      });
    };
    reader.readAsDataURL(file);
  });

  confirmCheckbox.addEventListener('change', () => {
    confirmCheck.classList.toggle('checked', confirmCheckbox.checked);
    updateSubmitState();
  });

  // 사람이 몰리는 시간(운동 끝나고 다 같이 인증할 때)엔 서버 저장 잠금이 붙잡혀 있어서
  // 첫 시도가 실패할 수 있어요. 서버가 (이름,미션) 기준으로 덮어쓰기 처리를 해서
  // 같은 요청이 여러 번 가도 중복 기록은 안 생겨요.
  async function submitWithRetry(payload, maxAttempts = 3) {
    let lastError = null;
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      if (attempt > 1) await new Promise(r => setTimeout(r, 700 * attempt));
      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Apps Script CORS 프리플라이트 회피용
          body: JSON.stringify(payload),
        });
        const result = await res.json();
        if (!result.success) throw new Error(result.error || '알 수 없는 오류');
        return result;
      } catch (err) {
        lastError = err;
      }
    }
    throw lastError;
  }

  // 서버 응답이 오면 진행 기록의 사진을 (임시로 넣어둔 압축본 대신) 실제 드라이브 URL로 바꿔줘요.
  function replacePendingPhotoWithUrl(missionId, url) {
    try {
      const p = JSON.parse(localStorage.getItem('gsProgress') || 'null');
      if (p && p.photos && p.photos[missionId]) {
        p.photos[missionId] = url;
        localStorage.setItem('gsProgress', JSON.stringify(p));
      }
    } catch (e) {}
  }

  // 재시도까지 다 실패하면, 나중에 앱을 다시 열 때 자동으로 다시 시도할 수 있도록
  // 대기열에 남겨둬요 (gymmap.html에서 다음에 열릴 때 flushPendingUploads가 처리해요).
  function queuePendingUpload(payload) {
    try {
      const queue = JSON.parse(localStorage.getItem('gsPendingUploads') || '[]');
      queue.push({ ...payload, queuedAt: Date.now() });
      localStorage.setItem('gsPendingUploads', JSON.stringify(queue));
    } catch (e) {}
  }

  async function submitToServerInBackground(payload) {
    try {
      const result = await submitWithRetry(payload);
      if (result.photoUrl) replacePendingPhotoWithUrl(payload.missionId, result.photoUrl);
    } catch (err) {
      queuePendingUpload(payload);
    }
  }

  submitBtn.addEventListener('click', () => {
    if (!pendingPhoto || !confirmCheckbox.checked || alreadyStampedToday) return;
    if (submitBtn.disabled) return; // 중복 클릭(연타) 방지
    submitBtn.disabled = true;

    // 화면은 서버 응답을 기다리지 않고 바로 완료를 보여줘요 (체감 속도 우선).
    // 실제 서버 전송/저장은 뒤에서 진행되고, 실패해도 대기열에 남아서 나중에 자동 재시도돼요.
    const progress = savedProgress;
    progress.photos = progress.photos || {};
    progress.photos[pending.missionId] = pendingPhoto; // 서버가 응답하면 실제 URL로 바뀌어요
    progress.lastCertifyDate = todayStr();
    localStorage.setItem('gsProgress', JSON.stringify(progress));
    localStorage.removeItem('gsPendingMission');

    submitToServerInBackground({
      name: character.name,
      zoneKey: pending.zoneKey,
      missionId: pending.missionId,
      title: pending.missionName,
      equipment: equipOptions.map(o => o.name).join(' · '),
      photo: pendingPhoto,
    });

    const doneAfter = Object.keys(progress.photos).length;
    const pct = Math.round(doneAfter / pending.total * 100);
    document.getElementById('successTitle').innerHTML = `${pending.missionName}, <em>클리어!</em>`;
    document.getElementById('successSub').textContent = `${character.name}님! 조금 더 힘내세요! 가까워졌어요!`;
    document.getElementById('progressCount').textContent = `${doneAfter}/${pending.total}`;
    document.getElementById('progressPct').textContent = `${pct}%`;
    document.getElementById('progressFill').style.width = pct + '%';

    uploadScreen.style.display = 'none';
    successScreen.classList.add('show');
    spawnConfetti();
  });

  document.getElementById('backToMapBtn').addEventListener('click', () => {
    window.location.href = 'gymmap.html';
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    localStorage.removeItem('gsPendingMission');
    window.location.href = 'gymmap.html';
  });

  // ===== 캐릭터 선택 화면에서 고른 캐릭터를 성공 화면 마스코트에 반영 =====
  const AVATAR_BODIES = {
    seal: `
      <defs><radialGradient id="sAvatarBody" cx="35%" cy="28%" r="78%"><stop offset="0%" stop-color="#FBFEFE"/><stop offset="100%" stop-color="#D6E8E9"/></radialGradient></defs>
      <ellipse cx="46" cy="130" rx="9" ry="6" fill="url(#sAvatarBody)"/>
      <ellipse cx="74" cy="130" rx="9" ry="6" fill="url(#sAvatarBody)"/>
      <ellipse cx="60" cy="106" rx="25" ry="19" fill="url(#sAvatarBody)"/>
      <ellipse cx="28" cy="99" rx="13" ry="8" fill="url(#sAvatarBody)" transform="rotate(25 28 99)"/>
      <ellipse cx="92" cy="96" rx="13" ry="8" fill="url(#sAvatarBody)" transform="rotate(-25 92 96)"/>
      <g transform="translate(96 92) rotate(18)"><ellipse cx="0" cy="0" rx="9" ry="5" fill="#7FC7D9"/><path d="M-9,0 L-15,-4 L-15,4 Z" fill="#7FC7D9"/></g>
      <circle cx="60" cy="56" r="40" fill="url(#sAvatarBody)"/>
      <ellipse cx="46" cy="72" rx="7" ry="4.5" fill="#FFC9C0" opacity="0.55"/>
      <ellipse cx="74" cy="72" rx="7" ry="4.5" fill="#FFC9C0" opacity="0.55"/>
      <rect x="38" y="42" width="13" height="4" rx="2" fill="#20302E" transform="rotate(-12 44 44)"/>
      <rect x="69" y="42" width="13" height="4" rx="2" fill="#20302E" transform="rotate(12 76 44)"/>
      <circle cx="46" cy="58" r="5" fill="#20302E"/><circle cx="74" cy="58" r="5" fill="#20302E"/>
      <circle cx="44.5" cy="56.5" r="1.6" fill="#fff"/><circle cx="72.5" cy="56.5" r="1.6" fill="#fff"/>
      <circle cx="60" cy="67" r="5" fill="#20302E"/>
      <path d="M50,74 Q55,80 60,74 Q65,80 70,74" stroke="#20302E" stroke-width="3" fill="none" stroke-linecap="round"/>
    `,
    gorilla: `
      <defs>
        <radialGradient id="sAvatarBody" cx="35%" cy="28%" r="78%"><stop offset="0%" stop-color="#56575B"/><stop offset="100%" stop-color="#232326"/></radialGradient>
        <linearGradient id="sAvatarSilver" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A2A6A9"/><stop offset="100%" stop-color="#7C8083"/></linearGradient>
      </defs>
      <ellipse cx="46" cy="130" rx="10" ry="7" fill="url(#sAvatarBody)"/>
      <ellipse cx="74" cy="130" rx="10" ry="7" fill="url(#sAvatarBody)"/>
      <ellipse cx="60" cy="106" rx="25" ry="19" fill="url(#sAvatarSilver)"/>
      <ellipse cx="26" cy="98" rx="12" ry="9" fill="url(#sAvatarBody)"/>
      <ellipse cx="94" cy="96" rx="12" ry="9" fill="url(#sAvatarBody)" transform="rotate(-14 94 96)"/>
      <g transform="translate(100 84)"><rect x="-15" y="-3" width="30" height="6" rx="3" fill="#8B8D90"/><circle cx="-15" cy="0" r="7" fill="#6E7073"/><circle cx="15" cy="0" r="7" fill="#6E7073"/></g>
      <circle cx="26" cy="42" r="9" fill="url(#sAvatarBody)"/><circle cx="94" cy="42" r="9" fill="url(#sAvatarBody)"/>
      <circle cx="60" cy="56" r="40" fill="url(#sAvatarBody)"/>
      <ellipse cx="60" cy="70" rx="15" ry="12" fill="#9DA1A4"/>
      <rect x="38" y="42" width="14" height="4" rx="2" fill="#151517" transform="rotate(-10 45 44)"/>
      <rect x="68" y="42" width="14" height="4" rx="2" fill="#151517" transform="rotate(10 75 44)"/>
      <circle cx="46" cy="59" r="5" fill="#151517"/><circle cx="74" cy="59" r="5" fill="#151517"/>
      <circle cx="44.5" cy="57.5" r="1.6" fill="#fff"/><circle cx="72.5" cy="57.5" r="1.6" fill="#fff"/>
      <circle cx="56" cy="65" r="1.6" fill="#151517"/><circle cx="64" cy="65" r="1.6" fill="#151517"/>
      <path d="M50,76 Q55,82 60,76 Q65,82 70,76" stroke="#151517" stroke-width="3" fill="none" stroke-linecap="round"/>
    `,
  };
  (function applyCharacterAvatar(){
    if (!AVATAR_BODIES[character.key]) return;
    document.getElementById('successMascotSvg').innerHTML = AVATAR_BODIES[character.key];
  })();

  function spawnConfetti(){
    const colors = ['#3EE3C7', '#8FF4E1', '#FF6B4A', '#FFD84D'];
    for (let i = 0; i < 24; i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animation = `fall ${0.9 + Math.random()*0.8}s ease-in ${Math.random()*0.3}s forwards`;
      successScreen.appendChild(c);
      setTimeout(() => c.remove(), 2000);
    }
  }
  const styleTag = document.createElement('style');
  styleTag.textContent = `@keyframes fall{0%{opacity:1; transform:translateY(0) rotate(0deg);}100%{opacity:0; transform:translateY(420px) rotate(360deg);}}`;
  document.head.appendChild(styleTag);
</script>

</body>
</html>
