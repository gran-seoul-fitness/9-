<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>그랑서울 피트니스 - 헬스장 맵</title>
<style>
  @font-face{ font-family:'NanumSquare'; src:url('fonts/NanumSquareL.woff2') format('woff2'); font-weight:300; font-display:swap; }
  @font-face{ font-family:'NanumSquare'; src:url('fonts/NanumSquareR.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face{ font-family:'NanumSquare'; src:url('fonts/NanumSquareB.woff2') format('woff2'); font-weight:700; font-display:swap; }
  @font-face{ font-family:'NanumSquare'; src:url('fonts/NanumSquareEB.woff2') format('woff2'); font-weight:800; font-display:swap; }
</style>
<style>

  :root{
    --bg-deep:#101718;
    --bg-panel:#1a2224;
    --bg-panel-2:#212b2d;
    --mint:#3EE3C7;
    --mint-soft:#8FF4E1;
    --ember:#FF6B4A;
    --text:#F2F6F5;
    --muted:#829894;
    --muted2:#7E9591;
    --line: rgba(62,227,199,0.16);
    --locked:#2a3436;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; font-weight:300;}
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 20% 10%, rgba(62,227,199,0.08), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(255,107,74,0.06), transparent 40%),
      var(--bg-deep);
    font-family:'NanumSquare', sans-serif;
    padding:32px 16px;
  }

  .phone{
    width:390px; max-width:100%;
    height:800px; max-height:92vh;
    background:linear-gradient(180deg,#151d1e 0%, #0d1213 100%);
    border-radius:44px;
    border:1px solid rgba(255,255,255,0.06);
    box-shadow:0 30px 80px rgba(0,0,0,0.55), inset 0 0 40px rgba(62,227,199,0.03);
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
  }

  .statusbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 24px 2px; color:var(--muted2); font-size:12.5px; font-weight:700;
  }

  /* 실제 폰에서 열었을 때는 폰 목업 틀 없이 화면 전체를 꽉 채우고,
     기기 자체 상태바랑 겹치는 가짜 시계는 숨겨요. */
  @media (max-width:480px){
    body{ padding:0; }
    .phone{
      width:100%; height:100vh; height:100dvh; max-height:none;
      border-radius:0; border:none; box-shadow:none;
    }
    .statusbar span:first-child{ display:none; }
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 20px 0;
  }
  .back-btn{
    width:30px;height:30px; border-radius:50%;
    background:var(--bg-panel); border:1px solid rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:center;
    color:var(--text); font-size:15px;
    cursor:pointer; transition:transform .12s ease;
  }
  .back-btn:active{ transform:scale(0.88); }
  .progress-pill{
    background:var(--bg-panel); border:1px solid var(--line);
    border-radius:100px; padding:6px 12px;
    font-size:11.5px; font-weight:700; color:var(--mint);
  }
  .progress-pill.dim{ color:var(--muted2); border-color:rgba(255,255,255,0.06); }

  .header-copy{ padding:8px 22px 0; }
  .eyebrow{ color:var(--mint); font-size:10px; font-weight:700; letter-spacing:3px; margin-bottom:4px; }
  h1{
    font-family:'NanumSquare', sans-serif; font-weight:900; color:var(--text);
    font-size:19px; line-height:1.25; margin:0 0 2px; letter-spacing:0.2px;
  }
  h1 em{ color:var(--mint); font-style:normal; -webkit-text-stroke:0.5px var(--mint); }

  /* ===== ZONE FLOOR ===== */
  .map-wrap{
    position:relative;
    flex:1;
    display:flex; align-items:center; justify-content:center;
    padding:4px 10px 0;
    min-height:0;
  }
  .map-stage{ position:relative; height:100%; aspect-ratio: 320 / 380; max-width:100%; }
  .map-svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; display:block; }

  .zone-label{
    position:absolute;
    transform:translate(-50%,0);
    background:rgba(26,34,36,0.94);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:12px;
    padding:6px 12px;
    text-align:center;
    cursor:pointer;
    min-width:76px;
    z-index:2;
  }
  .zone-label:active{ transform:translate(-50%,0) scale(0.96); }
  .zone-title{ color:var(--text); font-size:12.5px; font-weight:800; white-space:nowrap; }
  .zone-count{ color:var(--muted2); font-size:9.5px; margin-top:1px; white-space:nowrap; }
  .zone-label.complete .zone-title{ color:var(--mint-soft); }
  .zone-label.complete .zone-count{ color:var(--mint); font-weight:700; }

  .zone-cube{
    transform-box: fill-box; transform-origin: center;
    transition: transform .12s cubic-bezier(.34,1.56,.64,1), opacity .25s ease, filter .25s ease;
    animation: zoneFadeIn .5s ease both;
  }
  .zone-cube:active{ transform:scale(0.92); }
  #cube-weight{ animation-delay:.05s; }
  #cube-cardio{ animation-delay:.15s; }
  #cube-gx{ animation-delay:.25s; }
  #cube-stretch{ animation-delay:.35s; }
  @keyframes zoneFadeIn{ from{ opacity:0; } to{ opacity:1; } }

  #label-weight{ animation:labelFadeIn .4s ease .3s both; }
  #label-cardio{ animation:labelFadeIn .4s ease .4s both; }
  #label-gx{ animation:labelFadeIn .4s ease .5s both; }
  #label-stretch{ animation:labelFadeIn .4s ease .6s both; }
  @keyframes labelFadeIn{ from{ opacity:0; } to{ opacity:1; } }

  /* ===== BOTTOM GAUGE ===== */
  .gauge-wrap{ padding:10px 20px 18px; flex-shrink:0; }
  .gauge-bubble{
    position:relative;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:9px 14px;
    margin-bottom:4px;
    margin-left:66px;
    display:inline-block;
  }
  .gauge-bubble::after{
    content:"";
    position:absolute; left:-7px; bottom:14px;
    width:0; height:0;
    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
    border-right:8px solid var(--bg-panel);
  }
  .gauge-bubble-text{ color:var(--mint-soft); font-size:12px; font-weight:700; white-space:nowrap; display:inline-block; }
  .gauge-bubble-text.pop{ animation:bubblePop 0.42s cubic-bezier(.34,1.56,.64,1); }

  @keyframes bubblePop{
    0%{ opacity:0; transform:translateY(4px) scale(0.85); }
    55%{ opacity:1; transform:translateY(-2px) scale(1.06); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes avatarBob{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-4px) rotate(-2deg); }
  }
  @keyframes avatarNod{
    0%{ transform:translateY(0) scale(1); }
    30%{ transform:translateY(-3px) scale(1.03); }
    60%{ transform:translateY(1px) scale(0.98); }
    100%{ transform:translateY(0) scale(1); }
  }

  .gauge-row{ display:flex; align-items:flex-end; gap:10px; }
  .gauge-avatar{
    width:56px; height:70px; flex-shrink:0;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,0.4)); margin-bottom:2px;
    animation:avatarBob 2.6s ease-in-out infinite;
    transform-origin:bottom center;
    cursor:pointer;
  }
  .gauge-avatar.nod{ animation:avatarNod 0.5s ease-out; }
  .gauge-track{
    flex:1; height:16px; border-radius:100px;
    background:var(--locked);
    position:relative; overflow:hidden;
    margin-bottom:8px;
  }
  .gauge-fill{
    height:100%; border-radius:100px;
    background:linear-gradient(90deg, #22B79E, var(--mint));
    transition:width .4s ease;
    position:relative;
  }
  .gauge-count{ color:var(--mint); font-size:13px; font-weight:800; flex-shrink:0; white-space:nowrap; margin-bottom:8px; }

  /* ===== BOTTOM SHEET (zone detail) ===== */
  .sheet-backdrop{
    position:absolute; inset:0; background:rgba(8,12,13,0.6);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
    z-index:10;
  }
  .sheet-backdrop.show{ opacity:1; pointer-events:auto; }

  .sheet{
    position:absolute; left:0; right:0; bottom:0;
    background:var(--bg-panel);
    border-radius:24px 24px 0 0;
    border:1px solid rgba(255,255,255,0.06);
    padding:18px 20px 22px;
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    z-index:11;
    max-height:78%;
    overflow-y:auto;
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; border-radius:2px; background:var(--locked); margin:0 auto 14px; }
  .sheet-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .sheet-title{ color:var(--text); font-size:17px; font-weight:800; }
  .sheet-close{
    width:28px; height:28px; border-radius:50%;
    background:var(--bg-panel-2); color:var(--muted2);
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .sheet-sub{ color:var(--muted2); font-size:11.5px; margin-bottom:14px; }

  .mission-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 4px;
    border-bottom:1px solid rgba(255,255,255,0.05);
    cursor:pointer;
  }
  .mission-row:last-child{ border-bottom:none; }
  .mission-check{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .mission-check.done{ background:linear-gradient(135deg, var(--mint), #22B79E); }
  .mission-check.available{ background:var(--bg-panel-2); border:2px solid var(--mint); }
  .mission-check svg{ width:16px; height:16px; }
  .mission-row-text{ flex:1; }
  .mission-row-title{ color:var(--text); font-size:13.5px; font-weight:700; }
  .mission-row-sub{ color:var(--mint-soft); font-weight:700; font-size:10.5px; margin-top:1px; }
  .mission-row-arrow{ color:var(--muted2); font-size:14px; }

  /* ===== MISSION DETAIL MODAL ===== */
  .detail-backdrop{
    position:absolute; inset:0; background:rgba(8,12,13,0.72);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
    z-index:20; display:flex; align-items:flex-end;
  }
  .detail-backdrop.show{ opacity:1; pointer-events:auto; }
  .detail-card{
    width:100%; max-height:88%;
    background:var(--bg-panel);
    border-radius:24px 24px 0 0;
    border:1px solid rgba(255,255,255,0.06);
    padding:18px 20px 24px;
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    overflow-y:auto;
  }
  .detail-backdrop.show .detail-card{ transform:translateY(0); }

  .gallery-label{ color:var(--muted2); font-size:10.5px; font-weight:700; margin-bottom:6px; letter-spacing:0.3px; }
  .gallery-wrap{ margin-bottom:14px; }
  .gallery-group-title{
    color:var(--mint-soft); font-size:10px; font-weight:800;
    margin:8px 0 6px; letter-spacing:0.2px;
  }
  .gallery-group-title:first-child{ margin-top:0; }
  .photo-gallery{
    display:flex; gap:8px; overflow-x:auto;
    scroll-snap-type:x mandatory;
    padding-bottom:2px;
  }
  .photo-gallery::-webkit-scrollbar{ display:none; }
  .gallery-item{
    position:relative; flex:0 0 auto;
    width:78%; aspect-ratio:16/10;
    border-radius:14px; overflow:hidden;
    scroll-snap-align:start;
  }
  .gallery-item img{ width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-item.single{ width:100%; }
  .detail-badge{
    position:absolute; left:10px; bottom:8px; z-index:2;
    background:rgba(16,23,24,0.75);
    border:1px solid rgba(62,227,199,0.4);
    color:var(--mint-soft); font-size:9.5px; font-weight:800;
    padding:4px 9px; border-radius:100px;
  }

  .detail-title{ color:var(--text); font-size:16px; font-weight:800; margin-bottom:8px; }
  .detail-sets{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .set-chip{
    background:var(--bg-panel-2); color:var(--mint-soft);
    font-size:10.5px; font-weight:700;
    padding:4px 9px; border-radius:100px;
    border:1px solid var(--line);
  }

  .upload-zone{
    border:1.5px dashed rgba(62,227,199,0.35);
    border-radius:16px;
    background:var(--bg-panel-2);
    aspect-ratio: 16/9;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    cursor:pointer;
    margin-bottom:14px;
    position:relative; overflow:hidden;
  }
  .upload-zone.filled{ border-style:solid; border-color:var(--mint); }
  .upload-zone img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
  .upload-zone.filled img{ display:block; }
  .upload-zone.filled .upload-placeholder{ display:none; }
  .upload-placeholder{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .upload-placeholder svg{ width:26px; height:26px; }
  .upload-placeholder span{ color:var(--muted2); font-size:11.5px; font-weight:700; }

  .my-photo-label{ color:var(--muted2); font-size:10.5px; font-weight:700; margin-bottom:6px; letter-spacing:0.3px; }
  .my-photo{ width:100%; aspect-ratio:16/9; border-radius:14px; overflow:hidden; margin-bottom:14px; border:1.5px solid var(--mint); }
  .my-photo img{ width:100%; height:100%; object-fit:cover; display:block; }

  .detail-btn{
    width:100%; padding:15px; border:none; border-radius:14px;
    font-family:'NanumSquare', sans-serif; font-size:14.5px; font-weight:800;
    cursor:pointer;
  }
  .detail-btn.upload{
    background:linear-gradient(135deg, var(--mint), #22B79E); color:#0a1211;
    box-shadow:0 8px 20px rgba(62,227,199,0.28);
  }
  .detail-btn.disabled{
    background:#2a3436; color:#6c7d7a; cursor:not-allowed; box-shadow:none;
  }
  .detail-btn.close{
    background:var(--bg-panel-2); color:var(--muted2); border:1px solid rgba(255,255,255,0.06);
  }
  .detail-done-note{
    display:flex; align-items:center; gap:8px;
    background:rgba(62,227,199,0.08); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; margin-bottom:14px;
  }
  .detail-done-note svg{ width:18px; height:18px; flex-shrink:0; }
  .detail-done-note span{ color:var(--mint-soft); font-size:12px; font-weight:700; }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:0.01ms !important; animation-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<div class="phone">
  <div class="statusbar"><span>9:41</span><span>GRAN SEOUL</span></div>

  <div class="topbar">
    <div class="back-btn" id="backBtn">‹</div>
    <div style="display:flex; gap:6px;">
      <div class="progress-pill" id="weekPill">오늘 인증 가능</div>
      <div class="progress-pill" id="topPill">6/12 완료</div>
    </div>
  </div>

  <div class="header-copy">
    <div class="eyebrow">GRAN SEOUL FITNESS</div>
    <h1>오늘의 헬스장 <em>맵</em></h1>
  </div>

  <div class="map-wrap">
    <div class="map-stage">
    <svg class="map-svg" viewBox="0 0 320 380" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="floorGrad" cx="50%" cy="35%" r="75%">
          <stop offset="0%" stop-color="#20292b"/><stop offset="100%" stop-color="#161d1e"/>
        </radialGradient>
        <clipPath id="roomClip"><rect x="16" y="16" width="288" height="348" rx="22"/></clipPath>
      </defs>

      <rect x="16" y="16" width="288" height="348" rx="22" fill="url(#floorGrad)" stroke="rgba(62,227,199,0.18)" stroke-width="2"/>
      <g clip-path="url(#roomClip)" stroke="#26312f" stroke-width="1" opacity="0.5">
        <line x1="16" y1="60" x2="304" y2="60"/><line x1="16" y1="104" x2="304" y2="104"/>
        <line x1="16" y1="148" x2="304" y2="148"/><line x1="16" y1="192" x2="304" y2="192"/>
        <line x1="16" y1="236" x2="304" y2="236"/><line x1="16" y1="280" x2="304" y2="280"/>
        <line x1="16" y1="324" x2="304" y2="324"/>
      </g>
      <rect x="40" y="20" width="150" height="9" rx="4" fill="#5B7A80" opacity="0.5"/>
      <line x1="45" y1="20" x2="55" y2="29" stroke="#DDF7F0" stroke-width="1.5" opacity="0.4"/>
      <line x1="70" y1="20" x2="80" y2="29" stroke="#DDF7F0" stroke-width="1.5" opacity="0.4"/>
      <rect x="292" y="55" width="8" height="60" rx="2" fill="#3a4d52" opacity="0.6"/>

      <!-- ===== WEIGHT ZONE (cx78 cy120) ===== -->
      <g id="cube-weight" class="zone-cube" style="cursor:pointer;">
        <polygon points="0,17 34,0 34,28 0,45" fill="#189881" transform="translate(78,120)"/>
        <polygon points="-34,0 0,-17 34,0 0,17" fill="#8FF4E1" transform="translate(78,120)"/>
        <polygon points="-34,0 0,17 0,45 -34,28" fill="#1FAF95" transform="translate(78,120)"/>
        <g transform="translate(78,120)">
          <rect x="-11" y="-6" width="22" height="6" rx="3" fill="#0a1211" opacity="0.75"/>
          <circle cx="-11" cy="-3" r="6" fill="#0a1211" opacity="0.75"/>
          <circle cx="11" cy="-3" r="6" fill="#0a1211" opacity="0.75"/>
        </g>
      </g>

      <!-- ===== CARDIO ZONE (cx230 cy120) ===== -->
      <g id="cube-cardio" class="zone-cube" style="cursor:pointer;">
        <polygon points="0,17 34,0 34,28 0,45" fill="#189881" transform="translate(230,120)"/>
        <polygon points="-34,0 0,-17 34,0 0,17" fill="#8FF4E1" transform="translate(230,120)"/>
        <polygon points="-34,0 0,17 0,45 -34,28" fill="#1FAF95" transform="translate(230,120)"/>
        <path d="M-11,-2 L-5,-2 L-2,-8 L2,4 L5,-2 L11,-2" stroke="#0a1211" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(230,120)" opacity="0.8"/>
      </g>

      <!-- ===== GX ZONE (cx78 cy250) ===== -->
      <g id="cube-gx" class="zone-cube" style="cursor:pointer;">
        <polygon points="0,17 34,0 34,28 0,45" fill="#189881" transform="translate(78,250)"/>
        <polygon points="-34,0 0,-17 34,0 0,17" fill="#8FF4E1" transform="translate(78,250)"/>
        <polygon points="-34,0 0,17 0,45 -34,28" fill="#1FAF95" transform="translate(78,250)"/>
        <path d="M0,-9 L2.4,-3 L9,-3 L3.6,1 L5.5,7.5 L0,3.5 L-5.5,7.5 L-3.6,1 L-9,-3 L-2.4,-3 Z" fill="#0a1211" opacity="0.8" transform="translate(78,250)"/>
      </g>

      <!-- ===== STRETCH ZONE (cx230 cy250) ===== -->
      <g id="cube-stretch" class="zone-cube" style="cursor:pointer;">
        <polygon points="0,17 34,0 34,28 0,45" fill="#189881" transform="translate(230,250)"/>
        <polygon points="-34,0 0,-17 34,0 0,17" fill="#8FF4E1" transform="translate(230,250)"/>
        <polygon points="-34,0 0,17 0,45 -34,28" fill="#1FAF95" transform="translate(230,250)"/>
        <path d="M-9,-2 Q0,-11 9,-2" stroke="#0a1211" stroke-width="2.6" fill="none" stroke-linecap="round" transform="translate(230,250)" opacity="0.8"/>
      </g>
    </svg>

    <div class="zone-label complete" id="label-weight" style="left:24.4%; top:45.5%;">
      <div class="zone-title">웨이트</div>
      <div class="zone-count">3/4</div>
    </div>
    <div class="zone-label complete" id="label-cardio" style="left:71.9%; top:45.5%;">
      <div class="zone-title">유산소</div>
      <div class="zone-count">3/4</div>
    </div>
    <div class="zone-label" id="label-gx" style="left:24.4%; top:79.7%;">
      <div class="zone-title">GX</div>
      <div class="zone-count">0/1</div>
    </div>
    <div class="zone-label" id="label-stretch" style="left:71.9%; top:79.7%;">
      <div class="zone-title">스트레칭</div>
      <div class="zone-count">0/3</div>
    </div>
    </div>
  </div>

  <div class="gauge-wrap">
    <div class="gauge-bubble">
      <div class="gauge-bubble-text" id="gaugeMsg">조금만 더 하면 됩니다!</div>
    </div>
    <div class="gauge-row">
      <svg class="gauge-avatar" id="gaugeAvatarSvg" viewBox="0 0 120 150">
        <defs>
          <radialGradient id="gAvatarBody" cx="35%" cy="26%" r="80%"><stop offset="0%" stop-color="#FFBD86"/><stop offset="100%" stop-color="#F1782F"/></radialGradient>
        </defs>
        <path d="M92,114 Q112,106 107,88" stroke="#F1782F" stroke-width="9" fill="none" stroke-linecap="round"/>
        <rect x="99" y="107" width="9" height="5" rx="2" fill="#C24E12" transform="rotate(-25 103 109)"/>

  const ZONES = {
    weight: {
      name:'웨이트',
      missions:[
        { id:'back', name:'등', sets:['3세트','12회'] },

        { id:'legs', name:'하체', sets:['4세트','10회'] },
        { id:'shoulder', name:'어깨', sets:['3세트','12회','사이드레터럴'] },

    cardio: {

      missions:[

      ]
    },
    gx: {
      name:'GX',
      missions:[
        { id:'gxclass', name:'GX 수업·쿨다운', sets:['1회 참여'], equipNoun:'매트' },
      ]
    },
    stretch: {
      name:'스트레칭',
      missions:[
        { id:'foamroll', name:'폼롤러', sets:['5분'] },
        { id:'matstretch', name:'머신 스트레칭', sets:['10분'] },
      ]
    }
  };

  // 미션은 순서 상관없이 원하는 대로 완료할 수 있어요. 다만 스탬프(인증)는 하루에 한 번만 찍을 수 있어요.
  let doneIds = new Set();
  let lastCertifyDate = null; // 'YYYY-MM-DD' — 오늘 이미 스탬프를 찍었는지 확인용

  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function usedStampToday(){
    return lastCertifyDate === todayStr();
  }

  function allMissions(){
    const list = [];
    Object.values(ZONES).forEach(z => z.missions.forEach(m => list.push(m)));
    return list;
  }

  function recomputeStatus(){
    allMissions().forEach(m => { m.status = doneIds.has(m.id) ? 'done' : 'available'; });
  }

  // ===== 인증 완료 사진/진행률 저장소: missioncertify.html과 공유 =====
  (function loadProgress(){
    try {
      let saved = JSON.parse(localStorage.getItem('gsProgress') || 'null');
      if (!saved){
        // 최초 방문: 인증 기록 없이 시작
        saved = { photos: {} };
        localStorage.setItem('gsProgress', JSON.stringify(saved));
      }
      if (saved.photos){
        doneIds = new Set(Object.keys(saved.photos));
        const byId = {};
        allMissions().forEach(m => byId[m.id] = m);
        Object.keys(saved.photos).forEach(id => { if (byId[id] && saved.photos[id]) byId[id].userPhoto = saved.photos[id]; });
      }
      if (saved.lastCertifyDate) lastCertifyDate = saved.lastCertifyDate;
    } catch (e) {}
  })();
  recomputeStatus();

  // ===== 캐릭터 선택 화면에서 고른 캐릭터를 게이지 아바타에 반영 =====
  const AVATAR_BODIES = {
    seal: `
      <defs><radialGradient id="gAvatarBody" cx="35%" cy="28%" r="78%"><stop offset="0%" stop-color="#FBFEFE"/><stop offset="100%" stop-color="#D6E8E9"/></radialGradient></defs>
      <ellipse cx="46" cy="130" rx="9" ry="6" fill="url(#gAvatarBody)"/>
      <ellipse cx="74" cy="130" rx="9" ry="6" fill="url(#gAvatarBody)"/>
      <ellipse cx="60" cy="106" rx="25" ry="19" fill="url(#gAvatarBody)"/>
      <ellipse cx="28" cy="99" rx="13" ry="8" fill="url(#gAvatarBody)" transform="rotate(25 28 99)"/>
      <ellipse cx="92" cy="96" rx="13" ry="8" fill="url(#gAvatarBody)" transform="rotate(-25 92 96)"/>
      <g transform="translate(96 92) rotate(18)"><ellipse cx="0" cy="0" rx="9" ry="5" fill="#7FC7D9"/><path d="M-9,0 L-15,-4 L-15,4 Z" fill="#7FC7D9"/></g>
      <circle cx="60" cy="56" r="40" fill="url(#gAvatarBody)"/>
      <ellipse cx="46" cy="72" rx="7" ry="4.5" fill="#FFC9C0" opacity="0.55"/>
      <ellipse cx="74" cy="72" rx="7" ry="4.5" fill="#FFC9C0" opacity="0.55"/>
      <rect x="38" y="42" width="13" height="4" rx="2" fill="#20302E" transform="rotate(-12 44 44)"/>
      <rect x="69" y="42" width="13" height="4" rx="2" fill="#20302E" transform="rotate(12 76 44)"/>
      <circle cx="46" cy="58" r="5" fill="#20302E"/><circle cx="74" cy="58" r="5" fill="#20302E"/>
      <circle cx="44.5" cy="56.5" r="1.6" fill="#fff"/><circle cx="72.5" cy="56.5" r="1.6" fill="#fff"/>
      <circle cx="60" cy="67" r="5" fill="#20302E"/>
      <path d="M50,74 Q55,80 60,74 Q65,80 70,74" stroke="#20302E" stroke-width="3" fill="none" stroke-linecap="round"/>
    `,
    gorilla: `
      <defs>
        <radialGradient id="gAvatarBody" cx="35%" cy="28%" r="78%"><stop offset="0%" stop-color="#56575B"/><stop offset="100%" stop-color="#232326"/></radialGradient>
        <linearGradient id="gAvatarSilver" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A2A6A9"/><stop offset="100%" stop-color="#7C8083"/></linearGradient>
      </defs>
      <ellipse cx="46" cy="130" rx="10" ry="7" fill="url(#gAvatarBody)"/>
      <ellipse cx="74" cy="130" rx="10" ry="7" fill="url(#gAvatarBody)"/>
      <ellipse cx="60" cy="106" rx="25" ry="19" fill="url(#gAvatarSilver)"/>
      <ellipse cx="26" cy="98" rx="12" ry="9" fill="url(#gAvatarBody)"/>
      <ellipse cx="94" cy="96" rx="12" ry="9" fill="url(#gAvatarBody)" transform="rotate(-14 94 96)"/>
      <g transform="translate(100 84)"><rect x="-15" y="-3" width="30" height="6" rx="3" fill="#8B8D90"/><circle cx="-15" cy="0" r="7" fill="#6E7073"/><circle cx="15" cy="0" r="7" fill="#6E7073"/></g>
      <circle cx="26" cy="42" r="9" fill="url(#gAvatarBody)"/><circle cx="94" cy="42" r="9" fill="url(#gAvatarBody)"/>
      <circle cx="60" cy="56" r="40" fill="url(#gAvatarBody)"/>
      <ellipse cx="60" cy="70" rx="15" ry="12" fill="#9DA1A4"/>
      <rect x="38" y="42" width="14" height="4" rx="2" fill="#151517" transform="rotate(-10 45 44)"/>
      <rect x="68" y="42" width="14" height="4" rx="2" fill="#151517" transform="rotate(10 75 44)"/>
      <circle cx="46" cy="59" r="5" fill="#151517"/><circle cx="74" cy="59" r="5" fill="#151517"/>
      <circle cx="44.5" cy="57.5" r="1.6" fill="#fff"/><circle cx="72.5" cy="57.5" r="1.6" fill="#fff"/>
      <circle cx="56" cy="65" r="1.6" fill="#151517"/><circle cx="64" cy="65" r="1.6" fill="#151517"/>
      <path d="M50,76 Q55,82 60,76 Q65,82 70,76" stroke="#151517" stroke-width="3" fill="none" stroke-linecap="round"/>
    `,
  };
  (function applyCharacterAvatar(){
    try {
      const saved = JSON.parse(localStorage.getItem('gsCharacter') || 'null');
      if (!saved || !AVATAR_BODIES[saved.key]) return;
      document.getElementById('gaugeAvatarSvg').innerHTML = AVATAR_BODIES[saved.key];
    } catch (e) {}
  })();

  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = 'characterselect.html';
  });

  const sheet = document.getElementById('sheet');
  const sheetBackdrop = document.getElementById('sheetBackdrop');
  const sheetTitle = document.getElementById('sheetTitle');
  const sheetSub = document.getElementById('sheetSub');
  const sheetList = document.getElementById('sheetList');

  const detailBackdrop = document.getElementById('detailBackdrop');
  const detailTitle = document.getElementById('detailTitle');
  const detailSets = document.getElementById('detailSets');
  const photoGallery = document.getElementById('photoGallery');
  const availableBlock = document.getElementById('availableBlock');
  const doneBlock = document.getElementById('doneBlock');
  const goCertifyBtn = document.getElementById('goCertifyBtn');
  const myPhotoWrap = document.getElementById('myPhotoWrap');
  const myPhotoImg = document.getElementById('myPhotoImg');
  const closeDetailBtn = document.getElementById('closeDetailBtn');

  let currentZoneKey = null;
  let currentMission = null;

  function checkIcon(status){
    if (status === 'done') return '<svg viewBox="0 0 24 24" fill="none" stroke="#0a1211" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5,13 L10,18 L19,7"/></svg>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="#3EE3C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/></svg>';
  }

  function openSheet(zoneKey){
    currentZoneKey = zoneKey;
    const zone = ZONES[zoneKey];
    const done = zone.missions.filter(m => m.status === 'done').length;
    sheetTitle.textContent = zone.name;
    sheetSub.textContent = `${zone.missions.length}개 미션 중 ${done}개 완료`;
    sheetList.innerHTML = zone.missions.map(m => `
      <div class="mission-row ${m.status}" data-id="${m.id}">
        <div class="mission-check ${m.status}">${checkIcon(m.status)}</div>
        <div class="mission-row-text">
          <div class="mission-row-title">${m.name}</div>
          <div class="mission-row-sub">${m.sets.join(' · ')}</div>
        </div>
        <div class="mission-row-arrow">›</div>
      </div>
    `).join('');

    sheetList.querySelectorAll('.mission-row').forEach(row => {
      row.addEventListener('click', () => {
        const mission = zone.missions.find(m => m.id === row.dataset.id);
        openDetail(mission);
      });
    });

    sheetBackdrop.classList.add('show');
    sheet.classList.add('show');
  }

  function closeSheet(){
    sheetBackdrop.classList.remove('show');
    sheet.classList.remove('show');
  }

  function openDetail(mission){
    currentMission = mission;
    detailTitle.textContent = mission.name;
    detailSets.innerHTML = mission.sets.map(s => `<span class="set-chip">${s}</span>`).join('');

    const options = EQUIP_OPTIONS[mission.id] || [];
    document.getElementById('galleryLabel').textContent = options.length > 1 ? `기구 사진 (아래 중 택1)` : '기구 사진';
    document.getElementById('galleryLabel').style.display = options.length ? '' : 'none';
    photoGallery.style.display = options.length ? '' : 'none';

    function renderGalleryRow(opts){
      return `<div class="photo-gallery">${opts.map(opt => `
        <div class="gallery-item ${opts.length === 1 ? 'single' : ''}">
          <img src="${opt.img}" />
          <span class="detail-badge">${opt.name}</span>
        </div>
      `).join('')}</div>`;
    }

    const hasGroups = options.some(o => o.group);
    if (hasGroups){
      const groups = [...new Set(options.map(o => o.group))];
      photoGallery.innerHTML = groups.map(g => `
        <div class="gallery-group-title">${g}</div>
        ${renderGalleryRow(options.filter(o => o.group === g))}
      `).join('');
    } else {
      photoGallery.innerHTML = renderGalleryRow(options);
    }

    if (mission.status === 'done'){
      availableBlock.style.display = 'none';
      doneBlock.style.display = 'block';
      if (mission.userPhoto){
        myPhotoWrap.style.display = 'block';
        myPhotoImg.src = mission.userPhoto;
      } else {
        myPhotoWrap.style.display = 'none';
      }
    } else {
      doneBlock.style.display = 'none';
      availableBlock.style.display = 'block';
      if (usedStampToday()){
        goCertifyBtn.textContent = '오늘은 이미 인증했어요 · 내일 다시';
        goCertifyBtn.classList.add('disabled');
        goCertifyBtn.classList.remove('upload');
      } else {
        goCertifyBtn.textContent = '인증하러 가기';
        goCertifyBtn.classList.remove('disabled');
        goCertifyBtn.classList.add('upload');
      }
    }

    detailBackdrop.classList.add('show');
  }

  function closeDetail(){
    detailBackdrop.classList.remove('show');
  }

  document.getElementById('cube-weight').addEventListener('click', () => openSheet('weight'));
  document.getElementById('cube-cardio').addEventListener('click', () => openSheet('cardio'));
  document.getElementById('cube-gx').addEventListener('click', () => openSheet('gx'));
  document.getElementById('cube-stretch').addEventListener('click', () => openSheet('stretch'));
  document.getElementById('label-weight').addEventListener('click', () => openSheet('weight'));
  document.getElementById('label-cardio').addEventListener('click', () => openSheet('cardio'));
  document.getElementById('label-gx').addEventListener('click', () => openSheet('gx'));
  document.getElementById('label-stretch').addEventListener('click', () => openSheet('stretch'));

  sheetClose.addEventListener('click', closeSheet);
  sheetBackdrop.addEventListener('click', closeSheet);

  detailBackdrop.addEventListener('click', (e) => { if (e.target === detailBackdrop) closeDetail(); });
  closeDetailBtn.addEventListener('click', closeDetail);

  goCertifyBtn.addEventListener('click', () => {
    if (!currentMission || currentMission.status !== 'available') return;
    if (usedStampToday()) return;
    const zone = ZONES[currentZoneKey];
    const total = allMissions().length;
    localStorage.setItem('gsPendingMission', JSON.stringify({
      zoneKey: currentZoneKey,
      zoneName: zone.name,
      missionId: currentMission.id,
      missionName: currentMission.name,
      sets: currentMission.sets,
      equipOptions: EQUIP_OPTIONS[currentMission.id] || [],
      equipPhoto: (EQUIP_OPTIONS[currentMission.id] || [])[0]?.img || '',
      equipNoun: currentMission.equipNoun || '기구',
      doneBefore: doneIds.size,
      total: total,
    }));
    window.location.href = 'missioncertify.html';
  });

  function updateGauge(){
    let done = 0, total = 0;
    Object.values(ZONES).forEach(z => {
      z.missions.forEach(m => { total++; if (m.status === 'done') done++; });
    });
    const pct = Math.round(done / total * 100);
    document.getElementById('gaugeFill').style.width = pct + '%';
    document.getElementById('gaugeCount').textContent = `${done}/${total}`;
    document.getElementById('topPill').textContent = `${done}/${total} 완료`;

    ['weight','cardio','gx','stretch'].forEach(key => {
      const z = ZONES[key];
      const d = z.missions.filter(m => m.status === 'done').length;
      const el = document.getElementById('label-' + key);
      el.querySelector('.zone-count').textContent = `${d}/${z.missions.length}`;
      el.classList.toggle('complete', d === z.missions.length);
    });

    setMessagePool(pct);

    const stampPill = document.getElementById('weekPill');
    const stampedToday = usedStampToday();
    stampPill.textContent = stampedToday ? '오늘 인증 완료' : '오늘 인증 가능';
    stampPill.classList.toggle('dim', stampedToday);
  }

  // ===== 게이지 캐릭터 말풍선: 주기적으로 멘트를 바꾸며 팝 모션 재생 =====
  const MESSAGE_POOLS = {
    start:   ['시작이 반이다!', '가볍게 몸부터 풀어볼까요?', '오늘도 화이팅이에요 💪'],
    mid:     ['조금만 더 하면 됩니다!', '페이스 좋아요, 계속 가봐요!', '벌써 절반 가까이 왔어요'],
    late:    ['얼마 안남았어요!', '거의 다 왔어요, 조금만 더!', '이 기세로 끝까지 가봐요'],
    done:    ['완주 축하해요! 🎉', '4주 챌린지 클리어! 최고예요', '이제 진짜 근육 부자예요 🔥'],
  };
  let currentTier = null;
  let msgIndex = 0;
  let msgRotateTimer = null;

  function tierFor(pct){
    if (pct >= 100) return 'done';
    if (pct >= 61) return 'late';
    if (pct >= 26) return 'mid';
    return 'start';
  }

  let nodResetTimer = null;

  function playBubbleMessage(text){
    const bubbleEl = document.getElementById('gaugeMsg');
    const avatarEl = document.querySelector('.gauge-avatar');
    bubbleEl.classList.remove('pop');
    // 강제 리플로우로 애니메이션 재시작
    void bubbleEl.offsetWidth;
    bubbleEl.textContent = text;
    bubbleEl.classList.add('pop');
    avatarEl.classList.remove('nod');
    void avatarEl.offsetWidth;
    avatarEl.classList.add('nod');
    // nod는 1회성 모션이라 끝나면 다시 빼줘야 평소 bob 애니메이션으로 돌아옴
    clearTimeout(nodResetTimer);
    nodResetTimer = setTimeout(() => avatarEl.classList.remove('nod'), 500);
  }

  function startBubbleRotation(){
    if (msgRotateTimer) clearInterval(msgRotateTimer);
    msgRotateTimer = setInterval(() => {
      const pool = MESSAGE_POOLS[currentTier];
      msgIndex = (msgIndex + 1) % pool.length;
      playBubbleMessage(pool[msgIndex]);
    }, 3800);
  }

  function setMessagePool(pct){
    const tier = tierFor(pct);
    if (tier !== currentTier){
      currentTier = tier;
      msgIndex = 0;
      playBubbleMessage(MESSAGE_POOLS[tier][0]);
    }
    startBubbleRotation();
  }

  // 캐릭터를 직접 눌러도 같은 방식으로 멘트가 바뀌고 모션이 재생돼요.
  // 눌렀을 때는 자동 로테이션 타이머를 리셋해서 곧바로 또 안 겹쳐 보이게 해요.
  document.querySelector('.gauge-avatar').addEventListener('click', () => {
    const pool = MESSAGE_POOLS[currentTier];
    msgIndex = (msgIndex + 1) % pool.length;
    playBubbleMessage(pool[msgIndex]);
    startBubbleRotation();
  });

  updateGauge();
</script>

</body>
</html>
