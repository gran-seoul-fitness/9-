<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>그랑서울 피트니스 - 캐릭터 선택</title>
<style>
  @font-face{ font-family:'NanumSquare'; src:url('fonts/NanumSquareL.woff2') format('woff2'); font-weight:300; font-display:swap; }
  @font-face{ font-family:'NanumSquare'; src:url('fonts/NanumSquareR.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face{ font-family:'NanumSquare'; src:url('fonts/NanumSquareB.woff2') format('woff2'); font-weight:700; font-display:swap; }
  @font-face{ font-family:'NanumSquare'; src:url('fonts/NanumSquareEB.woff2') format('woff2'); font-weight:800; font-display:swap; }
</style>
<style>

  :root{
    --bg-deep:#101718;
    --bg-panel:#1a2224;
    --bg-panel-2:#212b2d;
    --mint:#3EE3C7;
    --mint-soft:#8FF4E1;
    --ember:#FF6B4A;
    --text:#F2F6F5;
    --muted:#829894;
    --muted2:#7E9591;
    --line: rgba(62,227,199,0.16);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; font-weight:300;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 10%, rgba(62,227,199,0.08), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(255,107,74,0.06), transparent 40%),
      var(--bg-deep);
    font-family:'NanumSquare', sans-serif;
    padding:32px 16px;
  }

  .phone{
    width:390px;
    max-width:100%;
    height:800px;
    max-height:92vh;
    background:linear-gradient(180deg,#151d1e 0%, #0d1213 100%);
    border-radius:44px;
    border:1px solid rgba(255,255,255,0.06);
    box-shadow:
      0 30px 80px rgba(0,0,0,0.55),
      inset 0 0 40px rgba(62,227,199,0.03);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  .statusbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 26px 4px; color:var(--muted2); font-size:13px; font-weight:700;
    letter-spacing:0.2px;
  }
  .statusbar span:last-child{ letter-spacing:1px; }

  /* 실제 폰에서 열었을 때는 폰 목업 틀 없이 화면 전체를 꽉 채우고,
     기기 자체 상태바랑 겹치는 가짜 시계는 숨겨요. */
  @media (max-width:480px){
    body{ padding:0; }
    .phone{
      width:100%; height:100vh; height:100dvh; max-height:none;
      border-radius:0; border:none; box-shadow:none;
    }
    .statusbar span:first-child{ display:none; }
  }

  .screen{
    flex:1;
    padding:14px 26px 24px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
  }

  .eyebrow{
    color:var(--mint);
    font-size:11px;
    font-weight:700;
    letter-spacing:3px;
    margin:6px 0 10px;
  }

  h1{
    font-family:'NanumSquare', sans-serif; font-weight:900;
    color:var(--text);
    font-size:30px;
    line-height:1.25;
    margin:0 0 8px;
    letter-spacing:0.5px;
  }
  h1 em{ color:var(--mint); font-style:normal; -webkit-text-stroke:0.5px var(--mint); }

  .sub{ color:var(--muted2); font-size:13.5px; line-height:1.6; margin:0 0 18px; }

  .progress-hint{
    display:flex; align-items:center; gap:8px;
    color:var(--muted2); font-size:11.5px; font-weight:500;
    margin-bottom:16px;
  }
  .progress-hint .dot{width:5px;height:5px;border-radius:50%;background:var(--mint);}

  .char-row{ display:flex; gap:12px; margin-bottom:16px; }

  .char-card{
    flex:1;
    background:var(--bg-panel);
    border:1.5px solid rgba(255,255,255,0.06);
    border-radius:20px;
    padding:14px 6px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    transition:border-color .25s ease, background .25s ease, transform .18s ease;
    position:relative;
  }
  .char-card:active{ transform:scale(0.96); }
  .char-card{ animation:cardEnter .45s ease both; }
  .char-card:nth-child(1){ animation-delay:.05s; }
  .char-card:nth-child(2){ animation-delay:.15s; }
  .char-card:nth-child(3){ animation-delay:.25s; }
  @keyframes cardEnter{ from{ opacity:0; } to{ opacity:1; } }
  .char-card.selected{
    border-color:var(--mint);
    background:var(--bg-panel-2);
    box-shadow:0 0 0 1px var(--mint), 0 0 24px rgba(62,227,199,0.28);
  }
  .char-card.selected::after{
    content:"✓";
    position:absolute; top:8px; right:8px;
    width:18px; height:18px;
    background:var(--mint); color:#0d1213;
    font-size:11px; font-weight:900;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }

  .avatar-stage{
    width:92px; height:112px;
    display:flex; align-items:flex-end; justify-content:center;
    margin-bottom:6px;
    filter:drop-shadow(0 8px 12px rgba(0,0,0,0.4));
  }
  .avatar-stage svg{ width:100%; height:100%; overflow:visible; }
  .char-card.selected .avatar-stage{ animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-6px) scale(1.03); }
  }

  .char-name{ color:var(--text); font-size:14px; font-weight:700; margin-bottom:2px; }
  .char-trait{ color:var(--muted2); font-size:10.5px; font-weight:500; }

  .mood-bubble{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 16px;
    color:var(--text);
    font-size:12.5px;
    line-height:1.7;
    margin-bottom:12px;
    word-break:keep-all;
    overflow-wrap:break-word;
    transition:opacity .25s ease;
  }
  .mood-bubble strong{ color:var(--mint); font-weight:800; -webkit-text-stroke:0.3px var(--mint); }

  .reward-preview{
    display:flex; align-items:center; gap:12px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:auto;
  }
  .reward-preview-icon{
    width:40px; height:40px; border-radius:12px; flex-shrink:0;
    background:var(--bg-panel-2);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }
  .reward-preview-text{ flex:1; min-width:0; }
  .reward-preview-title{ color:var(--text); font-size:12.5px; font-weight:800; margin-bottom:2px; }
  .reward-preview-sub{ color:var(--muted2); font-size:10.5px; }
  .reward-preview-count{ text-align:center; flex-shrink:0; }
  .reward-preview-count b{ display:block; color:var(--mint); font-size:16px; font-weight:900; }
  .reward-preview-count span{ display:block; color:var(--muted2); font-size:9px; font-weight:700; margin-top:1px; }

  .name-field{ margin-top:12px; }
  .name-field label{
    display:flex; align-items:baseline; justify-content:space-between;
    color:var(--muted2); font-size:11.5px; font-weight:700;
    margin-bottom:6px; letter-spacing:0.3px;
  }
  .name-field label .req{ color:var(--ember); margin-left:2px; }
  .name-field label .count{ font-weight:600; font-variant-numeric:tabular-nums; }
  .name-field label .count.max{ color:var(--ember); }
  .name-input{
    width:100%; box-sizing:border-box;
    background:var(--bg-panel);
    border:1.5px solid rgba(255,255,255,0.08);
    border-radius:14px;
    padding:14px 16px;
    color:var(--text);
    font-family:'NanumSquare', sans-serif;
    font-size:14.5px; font-weight:600;
    outline:none;
    transition:border-color .2s ease;
  }
  .name-input::placeholder{ color:var(--muted); font-weight:500; }
  .name-input:focus{ border-color:var(--mint); }
  .name-input.error{ border-color:var(--ember); }
  .name-error{
    display:none;
    color:var(--ember); font-size:11px; font-weight:600;
    margin-top:6px;
  }
  .name-error.show{ display:block; }

  .cta-wrap{ padding-top:16px; }
  .cta{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    font-family:'NanumSquare', sans-serif;
    font-size:15px;
    font-weight:900;
    letter-spacing:0.3px;
    background:#2a3436;
    color:#6c7d7a;
    cursor:not-allowed;
    transition:all .25s ease;
  }
  .cta.ready{
    background:linear-gradient(135deg, var(--mint), #22B79E);
    color:#0a1211;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(62,227,199,0.3);
  }
  .cta.ready:active{ transform:scale(0.98); }

  .toast{
    position:absolute;
    bottom:38px; left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--text); color:#101718;
    padding:10px 18px;
    border-radius:100px;
    font-size:12.5px; font-weight:700;
    opacity:0; pointer-events:none;
    transition:all .35s ease;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .char-card.selected .avatar-stage{ animation:none; }
    *{ transition-duration:0.01ms !important; animation-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<div class="phone">
  <div class="statusbar">

  <div class="screen">

            <circle cx="60" cy="56" r="40" fill="url(#gorillaDark)"/>
            <ellipse cx="60" cy="70" rx="15" ry="12" fill="#9DA1A4"/>

            <rect x="102" y="94" width="9" height="5" rx="2" fill="#C24E12" transform="rotate(-55 106 96)"/>

    </div>

    <div class="mood-bubble" id="moodBubble">캐릭터를 탭해서 성격을 확인해보세요 🐾</div>

    <div class="reward-preview">
      <div class="reward-preview-icon">🎁</div>
      <div class="reward-preview-text">
        <div class="reward-preview-title">4주 완주하면</div>
        <div class="reward-preview-sub">해비치 어메니티 3종 리워드</div>

      <label for="nameInput"><span>이름 <span class="req">*필수</span></span><span class="count" id="nameCount">0/10</span></label>
      <input type="text" id="nameInput" class="name-input" placeholder="회원님 성함을 입력해주세요" maxlength="10" />

  <div class="toast" id="toast">완료! 이 캐릭터로 챌린지를 시작해요</div>

<script>
  const cards = document.querySelectorAll('.char-card');
  const moodBubble = document.getElementById('moodBubble');
  const cta = document.getElementById('ctaBtn');
  const toast = document.getElementById('toast');
  const nameInput = document.getElementById('nameInput');
  const nameError = document.getElementById('nameError');
  const nameCount = document.getElementById('nameCount');
  let selected = null;

  function updateNameCount(){
    const len = nameInput.value.length;
    nameCount.textContent = `${len}/10`;
    nameCount.classList.toggle('max', len >= 10);
  }

  // 받침 유무에 따라 조사를 올바르게 선택 (은/는, 이/가 등)
  function josa(word, withBatchim, withoutBatchim){
    const ch = (word || '').trim().slice(-1);
    const code = ch.charCodeAt(0) - 0xAC00;
    const hasBatchim = code < 0 || code > 11171 ? true : (code % 28) !== 0;
    return hasBatchim ? withBatchim : withoutBatchim;
  }

  function updateCtaState(){
    const name = nameInput.value.trim();
    if (selected && name.length > 0){
      const card = document.querySelector('.char-card.selected');
      cta.textContent = `${card.dataset.name}${josa(card.dataset.name, '으로', '로')} 시작할게요`;
      cta.classList.add('ready');
    } else if (selected) {
      cta.textContent = '이름을 입력해주세요';
      cta.classList.remove('ready');
    } else {
      cta.textContent = '캐릭터를 먼저 골라주세요';
      cta.classList.remove('ready');
    }
  }

  nameInput.addEventListener('input', () => {
    nameInput.classList.remove('error');
    nameError.classList.remove('show');
    updateNameCount();
    updateCtaState();
  });

  cards.forEach(card => {
    card.addEventListener('click', () => {
      cards.forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selected = card.dataset.key;

      const name = card.dataset.name;
      const trait = card.dataset.trait;
      moodBubble.style.opacity = 0;
      setTimeout(() => {
        moodBubble.innerHTML = `<strong>${name}</strong>${josa(name, '은', '는')} ${trait}이에요.`;
        moodBubble.style.opacity = 1;
      }, 150);

      updateCtaState();
    });
  });

  cta.addEventListener('click', () => {
    if (!selected) return;
    if (nameInput.value.trim().length === 0){
      nameInput.classList.add('error');
      nameError.classList.add('show');
      nameInput.focus();
      return;
    }
    const stage = document.querySelector(`.char-card.selected .avatar-stage`);
    stage.style.animation = 'none';
    void stage.offsetWidth;
    stage.style.animation = 'bob 0.35s ease-in-out 3';

    localStorage.setItem('gsCharacter', JSON.stringify({
      key: selected,
      name: nameInput.value.trim(),
    }));

    const cardName = document.querySelector('.char-card.selected').dataset.name;
    toast.textContent = `완료! ${cardName}${josa(cardName, '으로', '로')} 챌린지를 시작해요`;
    toast.classList.add('show');
    setTimeout(() => { window.location.href = 'gymmap.html'; }, 1400);
  });

  // 이전에 고른 캐릭터/이름이 있으면 복원 (뒤로 돌아왔을 때 다시 고르지 않아도 되도록)
  (function restoreSelection(){
    try {
      const saved = JSON.parse(localStorage.getItem('gsCharacter') || 'null');
      if (!saved) return;
      const card = document.querySelector(`.char-card[data-key="${saved.key}"]`);
      if (card) card.click();
      if (saved.name) nameInput.value = saved.name;
      updateNameCount();
      updateCtaState();
    } catch (e) {}
  })();
</script>

</body>
</html>
