<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>그랑서울 피트니스 - 혼잡도 관리</title>
<style>
  :root{
    --bg-deep:#101718;
    --bg-panel:#1a2224;
    --bg-panel-2:#212b2d;
    --mint:#3EE3C7;
    --mint-soft:#8FF4E1;
    --ember:#FF6B4A;
    --text:#F2F6F5;
    --muted:#829894;
    --muted2:#7E9591;
    --line: rgba(62,227,199,0.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg-deep);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
    padding:24px 16px;
    color:var(--text);
  }
  .card{
    width:100%; max-width:380px;
    background:linear-gradient(180deg,#151d1e 0%, #0d1213 100%);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:28px;
    padding:28px 24px 32px;
    box-shadow:0 30px 80px rgba(0,0,0,0.55);
  }
  .eyebrow{ color:var(--mint); font-size:11px; font-weight:700; letter-spacing:3px; margin-bottom:6px; }
  h1{ font-size:20px; font-weight:800; margin:0 0 4px; }
  .sub{ color:var(--muted2); font-size:12.5px; margin:0 0 26px; line-height:1.5; }

  .count-wrap{ display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:10px; }
  .step-btn{
    width:56px; height:56px; border-radius:50%; flex-shrink:0;
    background:var(--bg-panel); border:1px solid rgba(255,255,255,0.08);
    color:var(--text); font-size:26px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; transition:transform .1s ease, background .15s ease;
  }
  .step-btn:active{ transform:scale(0.9); background:var(--bg-panel-2); }
  .count-display{ font-size:52px; font-weight:900; min-width:110px; text-align:center; font-variant-numeric:tabular-nums; }
  .count-unit{ text-align:center; color:var(--muted2); font-size:12px; font-weight:600; margin-bottom:24px; }

  .save-hint{
    text-align:center; font-size:11px; font-weight:700; color:var(--mint-soft);
    height:16px; margin-bottom:20px; opacity:0; transition:opacity .3s ease;
  }
  .save-hint.show{ opacity:1; }

  .exact-row{ display:flex; gap:8px; margin-bottom:18px; }
  .exact-input{
    flex:1; min-width:0;
    background:var(--bg-panel); border:1.5px solid rgba(255,255,255,0.08);
    border-radius:12px; padding:12px 14px; color:var(--text);
    font-size:14px; font-weight:600; outline:none;
  }
  .exact-input:focus{ border-color:var(--mint); }
  .exact-btn{
    padding:12px 18px; border:none; border-radius:12px;
    background:var(--bg-panel-2); color:var(--mint-soft);
    font-size:13px; font-weight:800; cursor:pointer; white-space:nowrap;
  }
  .exact-btn:active{ transform:scale(0.96); }

  .status-row{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:16px; border-top:1px solid rgba(255,255,255,0.06);
    color:var(--muted2); font-size:11px;
  }
  .status-row b{ color:var(--muted); font-weight:700; }

  a.back-link{
    display:block; text-align:center; margin-top:18px;
    color:var(--muted2); font-size:11.5px; text-decoration:none;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">GRAN SEOUL FITNESS · 관리자</div>
  <h1>지금 몇 명 있어요?</h1>
  <p class="sub">입장/퇴장할 때마다 +/-로 눌러주시면 회원 앱의 "실시간 혼잡도"에 바로 반영돼요.</p>

  <div class="count-wrap">
    <div class="step-btn" id="minusBtn">−</div>
    <div class="count-display" id="countDisplay">–</div>
    <div class="step-btn" id="plusBtn">+</div>
  </div>
  <div class="count-unit">명 이용 중</div>

  <div class="save-hint" id="saveHint">저장됐어요</div>

  <div class="exact-row">
    <input type="number" class="exact-input" id="exactInput" placeholder="정확한 인원으로 맞추기" min="0" />
    <button class="exact-btn" id="exactBtn">설정</button>
  </div>

  <div class="status-row">
    <span>마지막 업데이트</span>
    <b id="updatedAt">불러오는 중…</b>
  </div>

  <a class="back-link" href="gymmap.html">‹ 회원 화면으로</a>
</div>

<script>
  const countDisplay = document.getElementById('countDisplay');
  const minusBtn = document.getElementById('minusBtn');
  const plusBtn = document.getElementById('plusBtn');
  const exactInput = document.getElementById('exactInput');
  const exactBtn = document.getElementById('exactBtn');
  const saveHint = document.getElementById('saveHint');
  const updatedAtEl = document.getElementById('updatedAt');

  let current = 0;
  let saveHintTimer = null;

  function timeAgo(iso){
    if (!iso) return '없음';
    const diffMs = Date.now() - new Date(iso).getTime();
    const min = Math.floor(diffMs / 60000);
    if (min < 1) return '방금 전';
    if (min < 60) return `${min}분 전`;
    const hr = Math.floor(min / 60);
    return `${hr}시간 전`;
  }

  function flashSaved(){
    saveHint.classList.add('show');
    clearTimeout(saveHintTimer);
    saveHintTimer = setTimeout(() => saveHint.classList.remove('show'), 1200);
  }

  async function loadCurrent(){
    try {
      const res = await fetch('/api/occupancy');
      const data = await res.json();
      current = data.totalCount;
      countDisplay.textContent = current;
      updatedAtEl.textContent = data.source === 'manual' ? timeAgo(data.sourceUpdatedAt) : '수동 입력 없음 (CSV 값 표시 중)';
    } catch (e) {
      countDisplay.textContent = '?';
      updatedAtEl.textContent = '서버에 연결할 수 없어요';
    }
  }

  async function saveCount(next){
    current = Math.max(0, next);
    countDisplay.textContent = current;
    try {
      const res = await fetch('/api/occupancy/manual', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ totalCount: current }),
      });
      const data = await res.json();
      updatedAtEl.textContent = timeAgo(data.updatedAt);
      flashSaved();
    } catch (e) {
      updatedAtEl.textContent = '저장 실패 — 서버 연결 확인';
    }
  }

  minusBtn.addEventListener('click', () => saveCount(current - 1));
  plusBtn.addEventListener('click', () => saveCount(current + 1));
  exactBtn.addEventListener('click', () => {
    const v = parseInt(exactInput.value, 10);
    if (Number.isNaN(v) || v < 0) return;
    saveCount(v);
    exactInput.value = '';
  });

  loadCurrent();
  setInterval(loadCurrent, 15000);
</script>

</body>
</html>
